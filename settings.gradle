pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Fabric'
                    url = uri('https://maven.fabricmc.net')
                }
            }
            filter {
                includeGroupAndSubgroups('net.fabricmc')
            }
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'simplevoid'
includeBuild('build-logic')
include('common')
def loaders = providers.gradleProperty('loaders').getOrElse('neoforge,fabric').split(',')
loaders.each { loader ->
    if (!(loader in ['neoforge', 'fabric'])) throw new GradleException("Unknown loader: ${loader}")
    include(loader)
}
